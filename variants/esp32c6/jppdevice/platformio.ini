; ── J++Device (ESP32-C6 + SX1276) ─────────────────────────────────────────
[env:jppdevice]
extends = esp32c6_base
board = esp32-c6-devkitm-1
board_level = extra
build_flags =
    ${esp32c6_base.build_flags}
    -D JPPDEVICE
    -I variants/esp32c6/jppdevice
    ; The board's single USB-C port has no UART bridge chip — the console is
    ; the C6's native USB-Serial-JTAG, which is what USB_MODE=1 selects.
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; The RF front-end is matched for 868 MHz, so ship EU868 as the factory
    ; default instead of UNSET. Still changeable at runtime — this only keeps
    ; an unconfigured node off a band its matching network can't drive.
    -D USERPREFS_CONFIG_LORA_REGION=meshtastic_Config_LoRaConfig_RegionCode_EU_868
build_src_filter =
    ${esp32c6_base.build_src_filter}
    +<../variants/esp32c6/jppdevice>
upload_speed = 921600
