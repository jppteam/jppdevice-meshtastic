name: Build jppdevice

# One of this fork's own workflows. Meshtastic's are left in the tree untouched
# -- deleting them would conflict on every rebase onto a new upstream tag --
# and are disabled server-side instead. Everything named jpp* is ours and stays
# enabled:
#
#   gh api repos/OWNER/REPO/actions/workflows --paginate \
#     -q '.workflows[] | select(.path | startswith(".github/workflows/jpp") | not) | .id' \
#   | xargs -I{} gh api -X PUT repos/OWNER/REPO/actions/workflows/{}/disable
#
# Re-run that after a rebase that pulls in new upstream workflow files. Name any
# further workflows of ours jpp*.yml so they are excluded automatically.

on:
  push:
    branches: [jppdevice]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [jppdevice]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # protobufs is required -- the build fails without it
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'variants/esp32c6/jppdevice/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build
        run: pio run -e jppdevice

      - name: Rename firmware
        working-directory: .pio/build/jppdevice
        env:
          BUILD_INDEX: ${{ github.run_number }}
        run: |
          # *.factory.bin is the full flash image (bootloader + partition
          # table + OTA data + app), flashed at offset 0x0. The plain *.bin
          # is just the app partition, for OTA. Rename both to
          #   meshtastic-jppdevice-<meshtastic version>-<build index>.<kind>.bin
          # -- the raw PlatformIO output embeds a git hash that changes on
          # every commit.
          p="$GITHUB_WORKSPACE/version.properties"
          major=$(grep -oP 'major\s*=\s*\K[0-9]+' "$p")
          minor=$(grep -oP 'minor\s*=\s*\K[0-9]+' "$p")
          build=$(grep -oP 'build\s*=\s*\K[0-9]+' "$p")
          stem="meshtastic-jppdevice-${major}.${minor}.${build}-${BUILD_INDEX}"
          mv firmware-jppdevice-*.factory.bin "${stem}.merged.bin"
          mv firmware-jppdevice-*.bin "${stem}.app.bin"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-jppdevice
          path: |
            .pio/build/jppdevice/meshtastic-jppdevice-*.merged.bin
            .pio/build/jppdevice/meshtastic-jppdevice-*.app.bin
          # Fail loudly if the build output ever moves, rather than
          # silently publishing an empty artifact
          if-no-files-found: error
